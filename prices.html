<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giá hôm nay</title>
<meta name="description" content="Giá vàng, tỷ giá, chứng khoán, lãi suất và giá điện thoại hôm nay, trên một trang.">
<script>
  // Same theme choice as the dashboard (saved by index.html), else the system's.
  (function(){
    let t = null; try{ t = localStorage.getItem('fleet_theme'); }catch(e){}
    document.documentElement.setAttribute('data-theme', t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="markets.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:var(--canvas);color:var(--text);font-family:var(--font-body);}
  main{max-width:1180px;margin:0 auto;padding:20px 16px 48px;}
  .p-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .p-head h1{font-family:var(--font-display);font-size:28px;letter-spacing:-.02em;margin:0;}
  .p-date{font-size:14px;color:var(--text-secondary);margin-top:4px;}
  .p-links{display:flex;gap:8px;flex-wrap:wrap;}
  .p-links a{font-size:13px;color:var(--text-secondary);text-decoration:none;border:1px solid var(--border);border-radius:var(--radius-pill);padding:5px 11px;background:var(--bg);}
  .p-links a:hover{color:var(--text);}
  .p-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .markets-sub{margin:0;}
  .p-jump{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;}
  .p-jump a{flex:none;font-size:13px;color:var(--text);text-decoration:none;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-pill);padding:6px 12px;}
  .m-card{scroll-margin-top:12px;}
  @media (max-width:600px){ .p-head h1{font-size:24px;} .m-card{padding:14px;} }
</style>
</head>
<body>
<main>
  <header class="p-head">
    <div>
      <h1>Giá hôm nay</h1>
      <div class="p-date" id="today"></div>
    </div>
    <nav class="p-links" aria-label="Trang khác">
      <a href="./">Bảng điều khiển</a>
      <a href="projects.html">Dự án</a>
    </nav>
  </header>
  <div class="p-bar">
    <p class="markets-sub" id="updated">Đang tải…</p>
    <div class="range-tabs" role="group" aria-label="Khoảng thời gian">
      <button data-range="7" aria-pressed="false">7 ngày</button>
      <button data-range="30" aria-pressed="true">30 ngày</button>
      <button data-range="90" aria-pressed="false">90 ngày</button>
    </div>
  </div>
  <nav class="p-jump" id="jump" aria-label="Đi tới mục"></nav>
  <div id="mSections"></div>
</main>
<script src="markets.js"></script>
<script>
  document.getElementById('today').textContent =
    new Date().toLocaleDateString('vi-VN', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
  Markets.mount({
    sections: document.getElementById('mSections'),
    updated: document.getElementById('updated'),
    tabs: document.querySelectorAll('.range-tabs button'),
    compact: true,
  }).then(data => {
    const jump = document.getElementById('jump');
    ((data && data.sections) || []).filter(s => s.ok).forEach(s => {
      const a = document.createElement('a');
      a.href = `#m-${s.id}`; a.textContent = `${s.icon || ''} ${s.title}`.trim();
      jump.appendChild(a);
    });
  });
</script>
</body>
</html>
