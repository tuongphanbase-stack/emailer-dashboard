name: Daily Summary

on:
  schedule:
    # Refresh the dashboard data every 3 hours.
    - cron: "17 */3 * * *"
    # Morning summary email: 00:45 UTC = 7:45 AM in Vietnam (UTC+7).
    - cron: "45 0 * * *"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Also send the summary email"
        type: boolean
        default: true

permissions:
  contents: write   # commit data/summary.json
  actions: read     # bot-health section: workflow runs

concurrency:
  group: daily-summary
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_GMAIL: ${{ secrets.GMAIL_ADDRESS != '' && secrets.GMAIL_APP_PASSWORD != '' }}
      SEND: ${{ github.event.schedule == '45 0 * * *' || (github.event_name == 'workflow_dispatch' && inputs.send_email) }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the tests
        run: python -m unittest discover tests

      - name: Collect data from the emailer repos
        env:
          # Only needed once the emailer repos are private: a fine-grained
          # token with read access to their contents.
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          # Raises the API rate limit for the bot-health section.
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: python daily_summary.py collect

      - name: Save data for the dashboard charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/summary.json
          if ! git diff --cached --quiet; then
            git commit -q -m "Update summary data [skip ci]"
            git pull -q --rebase origin "$GITHUB_REF_NAME"
            git push -q origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Warn that the Gmail secrets are missing
        if: env.SEND == 'true' && env.HAS_GMAIL != 'true'
        run: echo "::warning::GMAIL_ADDRESS / GMAIL_APP_PASSWORD secrets are not set, so no email was sent. Add them in Settings -> Secrets and variables -> Actions."

      - name: Send summary email
        if: env.SEND == 'true' && env.HAS_GMAIL == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUMMARY_RECIPIENT: ${{ secrets.SUMMARY_RECIPIENT }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: python daily_summary.py send
